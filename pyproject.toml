[project]
name = "seldon"
version = "0.1.0"
description = "Assistant IA vocal polyvalent et extensible"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm-local = ["httpx>=0.27", "ollama>=0.6"]
llm-claude = ["anthropic>=1.0", "claude-agent-sdk>=0.2"]   # SDK : auth: abonnement
llm-openai = ["httpx>=0.27"]
stt = ["faster-whisper>=1.1", "sounddevice>=0.4", "numpy>=1.26"]
speakers = ["resemblyzer>=0.1.4", "sounddevice>=0.4", "numpy>=1.26"]
tts = ["piper-tts>=1.3", "sounddevice>=0.5", "pyttsx3>=2.90"]
camera = ["opencv-python-headless>=4.10"]
music = ["websockets>=13"]
gui = ["PySide6>=6.7", "ruamel.yaml>=0.18"]
all = ["seldon[llm-local,llm-claude,llm-openai,stt,speakers,tts,camera,music,gui]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
seldon = "seldon.__main__:main"
seldon-gui = "seldon.gui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seldon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
