# Configuration de Seldon. Chaque plugin : {engine: <nom>, options: {...}} (voir seldon/registry.py).
# Lancer : python -m seldon            (micro + haut-parleur)
#          python -m seldon --text     (clavier + console, pour tester le cerveau)

log_level: INFO
confirm: console          # validation des actions sensibles : console | always | never

stt:                      # oreille : micro -> texte
  engine: whisper
  options:
    model: small          # tiny / base / small / medium / large-v3
    language: fr
    device: cpu           # cuda si GPU NVIDIA
    compute_type: int8
    silence_ms: 700       # silence qui termine une phrase

speakers:                 # qui parle ; outil « voix » : apprend les voix inconnues ("none" pour désactiver)
  engine: resemblyzer
  options:
    voices_dir: data/voices
    threshold: 0.75       # enregistrer une voix au micro : python -m seldon.cli.enroll Bastien
    unknown_memory_s: 600 # une voix inconnue reste enregistrable 10 min
    max_samples: 40       # échantillons gardés par voix (les plus récents)

brain:                    # cerveau : le LLM qui choisit les outils
  engine: llamacpp        # serveur local `llama serve` (llama.cpp), options par défaut. Autre : claude
  backup:                 # LLM de secours si le principal échoue (même format)
    engine: claude
    options:
      auth: abonnement    # compte claude.ai via Claude Code (claude auth login) ; api : ANTHROPIC_API_KEY
      effort: medium

tts:                      # voix : texte -> haut-parleur
  engine: piper
  options:
    voice: fr_FR-tom-medium   # voix masculine ; autre : fr_FR-upmc-medium + speaker_id 1 (pierre)
    speed: 1.15           # 1.0 = normal ; 1.25 = 25 % plus rapide

memory:                   # mémoire des conversations (outil « conversations »)
  enabled: true
  dir: data/conversations
  new_after_idle_s: 600   # après 10 min de silence, nouvelle conversation (l'ancienne est gardée)

tools:                    # outils en Python (seldon/tools)
  - speak                 # indispensable : c'est ainsi que Seldon répond
  - engine: terminal
    options:
      mode: allowlist     # confirm (tout valider) | allowlist (niveaux bénigne / standard / sévère) | auto
      timeout: 30
      admins: [Bastien]   # leurs commandes standard passent sans confirmation
      allowed_speakers: null   # ex. [Bastien] : seuls eux lancent des commandes non bénignes
  - engine: camera
    options:
      device: 0
      save_dir: data/captures
  - engine: feishin       # musique : Remote control de Feishin, sinon MPRIS
    options:
      url: ws://127.0.0.1:4333
      backend: auto       # auto | remote | mpris
      timeout: 10
      # identifiants : FEISHIN_USERNAME / FEISHIN_PASSWORD dans le fichier .env
  - engine: desktop       # contrôle du PC (KDE Plasma 6) : notifications lues, luminosité, ne pas déranger…
    options:
      read_notifications: true
      ignore_apps: [Seldon]
      max_per_minute: 6
  - engine: nextcloud     # fichiers, notes, agenda, tâches, contacts en WebDAV (CalDAV, CardDAV)
    options:
      apps: [files, notes, calendar, tasks, contacts]
      notes_folder: Notes   # dossier de l'application Notes
      # NEXTCLOUD_HOST, NEXTCLOUD_USERNAME, NEXTCLOUD_PASSWORD dans le fichier .env
  - engine: web           # recherche sur internet et lecture de pages, par Firefox sans fenêtre (Playwright)
    options:
      browser: firefox    # firefox | chromium | webkit (installer : playwright install firefox)
      search_engine: duckduckgo   # duckduckgo | searxng (avec searxng_url)
      max_page_chars: 6000  # texte renvoyé par page lue (la suite à la demande)
      allow_private: false  # true : le navigateur peut joindre le réseau local
  - engine: files         # lire et écrire fichiers et dossiers, seulement dans « roots »
    options:
      roots: [~/Documents, ~/Téléchargements]   # le premier sert aux chemins relatifs ; dossier de Seldon toujours refusé
      admins: [Bastien]   # écraser, compléter, déplacer sans confirmation (supprimer reste confirmé)
      hidden: false       # true : fichiers cachés (.config…) permis ; clés, .env… toujours refusés

mcp:                      # serveurs MCP : un outil par serveur (seldon/mcp.py)
  - engine: home_assistant   # domotique via le serveur MCP de Home Assistant
    options:
      url: http://192.168.1.105:8123/api/mcp
      token_env: HA_TOKEN    # jeton longue durée dans le fichier .env (jamais ici)
      timeout: 10
      confirm: [lock, alarm_control_panel, portail, garage, serrure, verrou, alarme]   # appels à valider

skills: []                # consignes chargées à la demande : skills/<nom>/SKILL.md
